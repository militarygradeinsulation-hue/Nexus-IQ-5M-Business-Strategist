
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus IQ - 5M Business Strategist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000;
        }
        .mono { font-family: 'JetBrains+Mono', monospace; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444444; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
        
        .glass-panel::after {
            content: "";
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(255, 255, 255, 0.05),
                transparent
            );
            animation: scan 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -100%; }
            100% { top: 100%; }
        }

        @keyframes subtle-fade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-subtle-fade { animation: subtle-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .glow-pulse {
            animation: glow-pulse 4s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.05); }
            50% { box-shadow: 0 0 40px rgba(255,255,255,0.15); }
        }

        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .prose { line-height: 1.7; }
        .prose ul, .prose ol { padding-left: 1.5rem; margin-top: 1rem; margin-bottom: 1rem; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .prose li { margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 1rem; }
        .prose strong { font-weight: 800; }
        .prose em { font-style: italic; }
        .prose a { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(128, 128, 128, 0.4); transition: all 0.2s; }
        .prose a:hover { text-decoration-color: currentColor; }
        .prose code { font-family: 'JetBrains Mono', monospace; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }

        .light-mode .prose strong { color: #000; }
        .light-mode .prose a { color: #3b82f6; }
        .light-mode .prose code { background-color: rgba(0,0,0,0.05); color: #111; }
        
        .dark-mode .prose strong { color: #fff; }
        .dark-mode .prose a { color: #60a5fa; }
        .dark-mode .prose code { background-color: rgba(255,255,255,0.1); color: #eee; }

    </style>
